<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte</title>
 
  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: flex-start; /* Alignement en haut */
  height: 100vh;
  margin: 0;
  overflow-y: auto; /* Ajout d'une barre de défilement verticale */
}

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    p {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.7rem;
      margin: 0.4rem 0 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    label {
      font-size: 0.9rem;
      color: #333;
    }

    .error {
      color: red;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .password-strength {
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
    }

    .footer a {
      color: #000;
      text-decoration: none;
    }
    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
    }

    .checkbox-line input[type="checkbox"] {
      transform: scale(1.2);
      margin: 0;
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>Créer un compte</h2>
    <p>Rejoignez notre communauté et accédez à des ressources exclusives</p>

    <form id="signupForm">
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" required>
      <div id="prenomError" class="error"></div>

      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required>
      <div id="nomError" class="error"></div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <div id="emailError" class="error"></div>

      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" name="mdp" placeholder="Au moins 8 caractères" required>
      <div id="passwordStrength" class="password-strength"></div>
      <div id="mdpError" class="error"></div>

      <label for="tel">Téléphone </label>
      <input type="tel" id="tel" name="tel" placeholder="06 12 34 56 78" required>
      <div id="telError" class="error"></div>

      <label for="origine">Comment avez-vous connu notre site ?</label>
      <select id="origine" name="origine">
        <option value="">Sélectionnez une option</option>
        <option value="reseaux">Réseaux sociaux</option>
        <option value="ami">Recommandation</option>
        <option value="recherche">Moteur de recherche</option>
        <option value="professional">Professionnel de santé</option>
        <option value="autre">Autre</option>
      </select>

      <div class="checkbox-group">
  <div class="checkbox-line">
    <input type="checkbox" id="cgu" required>
    <label for="cgu">J'accepte les conditions d'utilisation et la politique de confidentialité</label>
  </div>
  <div class="checkbox-line">
    <input type="checkbox" id="newsletter">
    <label for="newsletter">Je souhaite recevoir la newsletter et les offres spéciales</label>
  </div>
</div>



      <button type="submit">Créer mon compte</button>
    </form>

    <div class="footer">
      Vous avez déjà un compte ? <a href="#">Se connecter</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');

    form.addEventListener('submit', function(event) {
      let isValid = true;

      // Clear previous errors
      document.querySelectorAll('.error').forEach(el => el.textContent = '');

      // Prénom et nom validation
      if (!form.prenom.value.trim()) {
        document.getElementById('prenomError').textContent = "Le prénom est requis.";
        isValid = false;
      }

      if (!form.nom.value.trim()) {
        document.getElementById('nomError').textContent = "Le nom est requis.";
        isValid = false;
      }

      // Email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(form.email.value)) {
        document.getElementById('emailError').textContent = "Veuillez entrer un email valide.";
        isValid = false;
      }

      // Password validation
      const password = form.mdp.value;
      const password2 = form.mdp2.value;

      if (password.length < 8) {
        document.getElementById('mdpError').textContent = "Le mot de passe doit contenir au moins 8 caractères.";
        isValid = false;
      }

      if (password !== password2) {
        document.getElementById('mdp2Error').textContent = "Les mots de passe ne correspondent pas.";
        isValid = false;
      }

      // Password strength indicator
      const strengthText = document.getElementById('passwordStrength');
      if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password) && /[!@#$%^&*]/.test(password)) {
        strengthText.textContent = "Force du mot de passe : Fort";
        strengthText.style.color = "green";
      } else if (password.length >= 6) {
        strengthText.textContent = "Force du mot de passe : Moyen";
        strengthText.style.color = "orange";
      } else {
        strengthText.textContent = "Force du mot de passe : Faible";
        strengthText.style.color = "red";
      }

      // Telephone validation
      const telRegex = /^0[1-9](\s?\d{2}){4}$/;
      if (form.tel.value && !telRegex.test(form.tel.value)) {
        document.getElementById('telError').textContent = "Veuillez entrer un numéro de téléphone valide (format français).";
        isValid = false;
      }

      
  </script>
</body>
</html>
