<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    p {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.7rem;
      margin: 0.4rem 0 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    label {
      font-size: 0.9rem;
      color: #333;
    }

    .checkbox-group {
      margin-bottom: 1rem;
    }

    .checkbox-group label {
      font-size: 0.85rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
    }

    .footer a {
      color: #000;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Créer un compte</h2>
    <p>Rejoignez notre communauté et accédez à des ressources exclusives</p>

    <form>
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" required>

      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" name="mdp" placeholder="Au moins 8 caractères" required>

      <label for="mdp2">Confirmer le mot de passe</label>
      <input type="password" id="mdp2" name="mdp2" required>

      <label for="tel">Téléphone (optionnel)</label>
      <input type="tel" id="tel" name="tel" placeholder="06 12 34 56 78">

      <label for="origine">Comment avez-vous connu notre site ?</label>
      <select id="origine" name="origine">
        <option value="">Sélectionnez une option</option>
        <option value="reseaux">Réseaux sociaux</option>
        <option value="ami">Recommandation</option>
        <option value="recherche">Recherche Google</option>
        <option value="autre">Autre</option>
      </select>

      <div class="checkbox-group">
        <label><input type="checkbox" required> J'accepte les conditions d'utilisation et la politique de confidentialité</label><br>
        <label><input type="checkbox"> Je souhaite recevoir la newsletter et les offres spéciales</label>
      </div>

      <button type="submit">Créer mon compte</button>
    </form>

    <div class="footer">
      Vous avez déjà un compte ? <a href="#">Se connecter</a>
    </div>
  </div>
</body>
</html>
