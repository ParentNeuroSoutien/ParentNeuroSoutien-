<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un compte</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      text-align: center;
      padding: 1rem;
    }

    header img {
      max-height: 60px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
    }

    .container {
      background: #fff;
      padding: 1.5rem 3rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    p {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.7rem;
      margin: 0.4rem 0 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    label {
      font-size: 0.9rem;
      color: #333;
    }

    .error {
      color: red;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .password-strength {
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }

    .footer a {
      color: #007bff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .checkbox-group {
      margin: 1rem 0;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      margin-bottom: 0.7rem;
    }

    .checkbox-line input[type="checkbox"] {
      margin-right: 0.5rem;
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo-parentneurosoutien.png" alt="Logo ParentNeuroSoutien" />
  </header>

  <main>
    <div class="container">
      <h2>Créer un compte</h2>
      <p>Rejoignez notre communauté et accédez à des ressources exclusives</p>

      <form id="signupForm">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="data[prenom]" required />

        <label for="nom">Nom</label>
        <input type="text" id="nom" name="data[nom]" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="data[email]" required />

        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" name="data[mdp]" required />

        <label for="tel">Téléphone</label>
        <input type="tel" id="tel" name="data[tel]" required />

        <label for="origine">Comment avez-vous connu notre site ?</label>
        <select id="origine" name="data[origine]">
          <option value="">Sélectionnez une option</option>
          <option value="reseaux">Réseaux sociaux</option>
          <option value="ami">Recommandation</option>
          <option value="recherche">Moteur de recherche</option>
          <option value="professional">Professionnel de santé</option>
          <option value="autre">Autre</option>
        </select>

        <div class="checkbox-group">
          <div class="checkbox-line">
            <input type="checkbox" id="cgu" name="data[conditionsAcceptees]" value="Oui" required />
            <label for="cgu">J'accepte les conditions d'utilisation</label>
          </div>
          <div class="checkbox-line">
            <input type="checkbox" id="newsletter" name="data[newsletter]" value="Oui" />
            <label for="newsletter">Je souhaite recevoir la newsletter</label>
          </div>
        </div>

        <input type="hidden" name="data[date]" id="dateField" />

        <button type="submit">Créer mon compte</button>
      </form>

      <div class="footer">
        Vous avez déjà un compte ? <a href="login.html">Se connecter</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('signupForm');
    const dateField = document.getElementById('dateField');
    const sheetdbUrl = "https://sheetdb.io/api/v1/n0zda9ixcv0z1"; // remplace ceci !

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      // Ajouter la date d'inscription
      dateField.value = new Date().toISOString().split("T")[0];

      fetch(sheetdbUrl, {
        method: "POST",
        body: new FormData(form)
      })
      .then(res => {
        alert("Compte créé avec succès !");
        window.location.href = "login.html";
      })
      .catch(err => {
        alert("Erreur lors de l'enregistrement.");
        console.error(err);
      });
    });
  </script>
</body>
</html>
