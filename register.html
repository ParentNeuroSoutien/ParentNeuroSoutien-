<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un compte | ParentNeuroSoutien</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      padding: 1rem;
      text-align: center;
    }

    header img {
      max-height: 60px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 2rem;
    }

    h2 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 0.5rem;
    }

    p {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.2rem;
      margin-bottom: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .checkbox-group {
      margin: 1rem 0;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      margin-bottom: 0.7rem;
    }

    .checkbox-line input[type="checkbox"] {
      margin-right: 0.5rem;
      width: 16px;
      height: 16px;
    }

    .error {
      color: red;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .password-strength {
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo-parentneurosoutien.png" alt="Logo ParentNeuroSoutien" />
  </header>

  <main>
    <div class="container">
      <h2>Créer un compte</h2>
      <p>Rejoignez notre communauté et accédez à des ressources exclusives</p>

      <form id="signupForm">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" required />

        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" name="mdp" placeholder="Au moins 8 caractères" required />
        <div id="passwordStrength" class="password-strength"></div>

        <label for="tel">Téléphone</label>
        <input type="tel" id="tel" name="tel" placeholder="06 12 34 56 78" required />

        <label for="origine">Comment avez-vous connu notre site ?</label>
        <select id="origine" name="origine">
          <option value="">Sélectionnez une option</option>
          <option value="reseaux">Réseaux sociaux</option>
          <option value="ami">Recommandation</option>
          <option value="recherche">Moteur de recherche</option>
          <option value="professional">Professionnel de santé</option>
          <option value="autre">Autre</option>
        </select>

        <div class="checkbox-group">
          <div class="checkbox-line">
            <input type="checkbox" id="cgu" required />
            <label for="cgu">J'accepte les conditions d'utilisation et la politique de confidentialité</label>
          </div>
          <div class="checkbox-line">
            <input type="checkbox" id="newsletter" />
            <label for="newsletter">Je souhaite recevoir la newsletter et les offres spéciales</label>
          </div>
        </div>

        <button type="submit">Créer mon compte</button>
      </form>

      <div class="footer">
        Vous avez déjà un compte ? <a href="login.html">Se connecter</a>
      </div>
    </div>
  </main>
</body>
</html>
