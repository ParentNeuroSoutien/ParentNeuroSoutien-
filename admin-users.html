<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des utilisateurs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 2rem;
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      max-width: 1000px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      padding: 0.5rem;
      width: 60%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 0.5rem 1rem;
      background: #000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.75rem;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
    }

    .empty-message {
      text-align: center;
      color: #999;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestion des utilisateurs</h1>
    <div class="actions">
      <input type="text" id="search" placeholder="Rechercher un utilisateur..." />
      <button id="export">Exporter</button>
    </div>
    <table id="usersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Date d'inscription</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Contenu dynamique -->
      </tbody>
    </table>
    <div id="emptyMessage" class="empty-message" style="display: none;">
      Aucun utilisateur trouvé.
    </div>
  </div>

  <script>
    if (!localStorage.getItem('authenticated')) {
      window.location.href = "login.html";
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    const tableBody = document.querySelector("#usersTable tbody");
    const searchInput = document.getElementById("search");
    const emptyMessage = document.getElementById("emptyMessage");

    function displayUsers(filter = "") {
      tableBody.innerHTML = "";
      const filteredUsers = users.filter(user =>
        user.prenom.toLowerCase().includes(filter.toLowerCase()) ||
        user.nom.toLowerCase().includes(filter.toLowerCase()) ||
        user.email.toLowerCase().includes(filter.toLowerCase())
      );

      if (filteredUsers.length === 0) {
        emptyMessage.style.display = "block";
        return;
      }

      emptyMessage.style.display = "none";

      filteredUsers.forEach(user => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.id}</td>
          <td>${user.prenom}</td>
          <td>${user.nom}</td>
          <td>${user.email}</td>
          <td>${user.tel}</td>
          <td>${user.date}</td>
          <td>
            <button onclick="editUser(${user.id})">Modifier</button>
            <button onclick="deleteUser(${user.id})" style="background: red;">Supprimer</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function editUser(userId) {
      alert(`Modifier l'utilisateur avec l'ID ${userId}`);
    }

    function deleteUser(userId) {
      const confirmation = confirm(`Êtes-vous sûr de vouloir supprimer l'utilisateur avec l'ID ${userId} ?`);
      if (confirmation) {
        const userIndex = users.findIndex(user => user.id === userId);
        if (userIndex !== -1) {
          users.splice(userIndex, 1);
          localStorage.setItem("users", JSON.stringify(users));
          displayUsers(searchInput.value);
        }
      }
    }

    document.getElementById("export").addEventListener("click", () => {
      const csvContent = "data:text/csv;charset=utf-8," +
        ["ID,Prénom,Nom,Email,Téléphone,Date d'inscription"]
          .concat(users.map(user =>
            `${user.id},${user.prenom},${user.nom},${user.email},${user.tel},${user.date}`
          )).join("\n");

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "utilisateurs.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    searchInput.addEventListener("input", (e) => {
      displayUsers(e.target.value);
    });

    displayUsers();
  </script>
</body>
</html>
