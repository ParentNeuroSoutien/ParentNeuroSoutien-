<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion | E-commerce Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #000;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 2rem;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 0.5rem;
    }

    p {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 0.3rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .forgot-link {
      text-align: right;
      font-size: 12px;
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
    }

    .forgot-link a {
      color: #007bff;
      text-decoration: none;
    }

    .forgot-link a:hover {
      text-decoration: underline;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background: #000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      margin-top: 1.5rem;
    }

    .footer a {
      color: #007bff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h2>ParentNeuroSoutien</h2>
  </header>

  <main>
    <div class="container">
      <h1>Connexion</h1>
      <p>Entrez vos identifiants pour vous connecter</p>
      <form>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="exemple@email.com" required />
        </div>
        <div>
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required />
          <div class="forgot-link">
            <a href="#">Mot de passe oublié ?</a>
          </div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember">Se souvenir de moi</label>
        </div>
        <button type="submit">Se connecter</button>
      </form>

      <div class="footer">
        Vous n'avez pas de compte ? <a href="login.html">Créer un compte</a>
      </div>
    </div>
  </main>
</body>
</html>
